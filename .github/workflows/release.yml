# Crea la release de GitHub cada vez que se sube un tag vX.Y.Z, con las notas del CHANGELOG.
# Así un tag nunca queda sin release. Ver .github/RELEASE.md.
# Recruiting OS · Licencia MIT (ver LICENSE en la raíz del repo).
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag que ya existe (por ejemplo, v0.4.0). Crea su release si falta y revisa que no falte ninguna."
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Traer los tags anotados
        run: git fetch --force --tags origin

      - name: Crear la release desde el CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: bash .github/scripts/release-desde-changelog.sh "$TAG"
